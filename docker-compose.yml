version: "3.9"

services:

  backend:

    build: .

    container_name: bytoby_backend

    restart: always

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

    env_file:
      - .env

  postgres:

    image: postgres:16

    container_name: bytoby_postgres

    restart: always

    environment:

      POSTGRES_USER: bytoby

      POSTGRES_PASSWORD: bytoby123

      POSTGRES_DB: bytoby

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7

    container_name: bytoby_redis

    restart: always

    ports:
      - "6379:6379"

volumes:

  postgres_data:
